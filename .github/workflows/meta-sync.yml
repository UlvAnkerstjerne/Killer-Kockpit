name: Daily Meta Sync

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch: {}    # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Meta sync
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST https://kockpit.killerkebab.com/api/meta/sync \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Summary: $(echo "$response" | jq -r '.summary // "no summary"')"
          if echo "$response" | jq -e 'has("errors")' > /dev/null 2>&1; then
            echo "Errors:"
            echo "$response" | jq -r '.errors[]'
          fi
          echo "$response" | jq -e '.ok == true' > /dev/null
